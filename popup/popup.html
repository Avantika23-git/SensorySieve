<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>SensorySieve</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>SensorySieve</h1>

  <div class="toggle-row">
    <label for="parkinsonsMode">Parkinson's Mode</label>
    <input type="checkbox" id="parkinsonsMode" />
  </div>

  <div class="toggle-row">
    <label for="focusMode">Focus Mode</label>
    <input type="checkbox" id="focusMode" />

    <label for="dyslexiaMode">Dyslexia Mode</label>
    <input type="checkbox" id="dyslexiaMode" />
  </div>

  <script src="popup.js"></script>
</body>
</html>
